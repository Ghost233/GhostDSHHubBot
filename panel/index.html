<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hub-bot 面板</title>
<link rel="stylesheet" href="/hub-bot/panel/style.css">
</head>
<body>
<header class="topbar">
  <h1>hub-bot</h1>
  <nav id="navigation" class="tabs" aria-label="Hub Bot 导航" hidden>
    <a class="tab" href="#board" data-page="board">总览</a>
    <a class="tab" href="#timers-page" data-page="timers-page">提醒</a>
    <a class="tab" href="#run-history" data-page="run-history">运行记录</a>
    <a class="tab" href="#connections" data-page="connections">连接</a>
    <a class="tab" href="#settings" data-page="settings">设置</a>
  </nav>
  <a id="connection-status" class="connection-status" href="#connections" hidden></a>
  <span id="refreshed" class="refreshed" title="上次刷新时间"></span>
</header>

<main id="app">
  <section id="token-gate" class="token-gate" hidden>
    <p>输入管理 token（与 profile 的 <code>devApi.token</code> 相同）以打开面板。</p>
    <form id="token-form">
      <input id="token-input" type="password" autocomplete="off" placeholder="x-hub-bot-token">
      <button type="submit">进入</button>
    </form>
    <p id="token-error" class="error" hidden></p>
  </section>

  <div id="load-state" class="load-state" hidden>
    <p id="load-message" role="status"></p>
    <button id="retry-load" class="btn" type="button" hidden>重试</button>
  </div>

  <section id="board" class="page" aria-labelledby="board-title" hidden>
    <h2 id="board-title" class="page-title">工作总览</h2>
    <div id="health" class="health" hidden></div>
    <div class="overview-layout">
      <div class="overview-work">
        <section class="overview-card" aria-labelledby="needs-title">
          <h3 id="needs-title" class="q">需要您处理</h3>
          <div id="needs-me" class="cards"></div>
        </section>
        <section class="overview-card" aria-labelledby="progress-title">
          <h3 id="progress-title" class="q">工作进展</h3>
          <div id="by-stage" class="groups"></div>
        </section>
        <section class="overview-card" aria-labelledby="results-title">
          <h3 id="results-title" class="q">结果</h3>
          <div id="outcomes" class="cards"></div>
        </section>
        <details id="ticket-history" class="overview-card">
          <summary>任务历史</summary>
          <div id="history-tickets" class="groups"></div>
        </details>
      </div>
      <aside class="overview-side">
        <section class="overview-card" aria-labelledby="owners-title">
          <h3 id="owners-title" class="q">负责人</h3>
          <div id="owners" class="cards"></div>
        </section>
        <section class="overview-card" aria-labelledby="next-wake-title">
          <h3 id="next-wake-title" class="q">下次唤醒</h3>
          <div id="next-wake"></div>
        </section>
        <section class="overview-card" aria-labelledby="recent-title">
          <h3 id="recent-title" class="q">最近触发</h3>
          <div id="triggers" class="cards"></div>
        </section>
        <section class="overview-card" aria-labelledby="intake-title">
          <h3 class="q" id="intake-title" hidden>投喂口径（只读）</h3>
          <div id="intake" class="cards"></div>
        </section>
      </aside>
    </div>
  </section>

  <section id="timers-page" class="page" aria-labelledby="timers-title" hidden>
    <h2 class="page-title" id="timers-title">提醒</h2>
    <div id="timers" class="cards"></div>
  </section>

  <section id="run-history" class="page" aria-labelledby="runs-title" hidden>
    <h2 id="runs-title" class="page-title">后台运行记录</h2>
    <div class="run-filters">
      <label>通知状态 <select id="run-status">
        <option value="">全部</option><option value="silent">未通知</option><option value="waiting">待发送或汇总</option>
        <option value="sent">发送成功</option><option value="failed">发送失败</option><option value="in-progress">无发送记录</option>
      </select></label>
      <label>来源 <select id="run-source">
        <option value="">全部</option><option value="github">GitHub</option><option value="timer">提醒</option>
      </select></label>
      <button id="run-refresh" class="btn" type="button">刷新运行记录</button>
    </div>
    <form id="notification-form" class="run-filters">
      <label>通知编号 <input id="notification-id" type="text" required autocomplete="off" maxlength="200"></label>
      <button class="btn" type="submit">查找通知</button>
    </form>
    <div id="notification-index" aria-live="polite"></div>
    <div id="run-list" class="cards" aria-live="polite"></div>
  </section>

  <section id="connections" class="page" aria-labelledby="connections-title" hidden>
    <h2 id="connections-title" class="page-title">连接</h2>
    <div id="connection-content"></div>
  </section>
  <section id="settings" class="page" aria-labelledby="settings-title" hidden>
    <h2 id="settings-title" class="page-title">设置</h2>
    <div id="settings-content"></div>
  </section>
</main>

<script src="/hub-bot/panel/vendor/qrcode.cjs"></script>
<script src="/hub-bot/panel/app.js"></script>
</body>
</html>
