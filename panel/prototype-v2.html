function runsView(){const rs=filtered(data.runs).filter(r=>runFilter==='all'||r.status===runFilter);return pageHead('每次运行，都能查到去向','未通知是一次明确决定，发送成功表示通道已接受，不等于已读。')+'<div class="filter-row">'+[['all','全部'],['silent','未通知'],['waiting','等待汇总'],['sent','发送成功'],['failed','发送失败']].map(x=>'<button class="filter-btn '+(runFilter===x[0]?'active':'')+'" data-action="run-filter" data-id="'+x[0]+'">'+x[1]+'</button>').join('')+'</div><section class="card"><table class="data-table"><thead><tr><th>运行 / 来源</th><th>通知去向</th><th class="hide-small">负责人</th><th>时间</th><th></th></tr></thead><tbody>'+rs.map(r=>'<tr><td><strong>'+esc(r.title)+'</strong><div class="tiny">'+esc(r.source)+'</div></td><td>'+pill(runText[r.status],runTone[r.status])+'</td><td class="hide-small">'+esc(owner(r.owner).repo)+'</td><td class="mono">'+r.time+'</td><td>'+btn('明细','run',r.id,'compact')+'</td></tr>').join('')+'</tbody></table>'+(rs.length?'':'<div class="empty">该范围暂无运行</div>')+'</section>';}
function settingsView(){return pageHead('连接与设置','配置放在这里；需要你处理的任务留在工作台。')+'<div class="settings-grid"><section class="card"><div class="card-head"><h2>飞书</h2>'+pill('已连接','green')+'</div><div class="pad"><div class="row"><span class="avatar channel-symbol">飞</span><div><h3>DSH 中转 Bot</h3><span class="small muted">一个入口，按负责人身份路由</span></div></div><div class="rule"></div><div class="settings-line"><span>消息接收</span><span>长连接</span></div><div class="settings-line"><span>授权范围</span><span>由飞书管理后台配置</span></div><div class="settings-line"><span>普通结果通知间隔</span><select id="notify-interval" class="select-mini" aria-label="通知汇总间隔"><option value="60">60 秒</option><option value="120">120 秒</option><option value="300">300 秒</option></select></div><div class="small muted" style="margin-top:15px">问答、确认、新阻塞与约定提醒即时通知，不占普通结果额度。</div></div></section><section class="card"><div class="card-head"><h2>GitHub</h2>'+pill('监听中','green')+'</div><div class="pad"><p class="small muted">监听范围跟随仓库负责人注册表。</p>'+data.owners.filter(o=>o.id!=='chief').map(o=>'<div class="settings-line"><span>'+esc(o.repo)+'</span><span class="tiny">已注册负责人</span></div>').join('')+'<div class="settings-line"><span>总负责人模型</span><span>使用当前 profile 配置</span></div></div></section><section class="card"><div class="card-head"><h2>外部记忆</h2>'+pill('接入暂缓')+'</div><div class="pad"><p class="small">先按已确认的需求和测试方法选型，再设计接入。</p><p class="small muted" style="margin-top:10px">目前没有可启用的记忆服务。身份、任务、汇报和手动换实例均不依赖记忆。</p>'+btn('查看需求与测试边界','memory',null,'compact')+'</div></section><section class="card"><div class="card-head"><h2>工作纪律</h2></div><div class="pad"><div class="settings-line"><span>确认有效期</span><span>默认 24 小时</span></div><div class="settings-line"><span>实例更换</span><span>仅手动</span></div><div class="settings-line"><span>旧实例记录</span><span>归档保留</span></div><div class="settings-line"><span>运行记录</span><span>可追溯通知决定</span></div></div></section></div>';}
function render(){if(view==='overview'&&variant==='B'&&scope==='all')scope='hub';renderNav();$('#main').innerHTML=view==='overview'?(variant==='A'?overviewA():variant==='B'?overviewB():overviewC()):view==='owners'?ownersView():view==='timers'?timersView():view==='runs'?runsView():settingsView();$('#variant-label').textContent=variant+' · '+labels[variant];$('#variant-choices').innerHTML=Object.keys(labels).map(k=>'<button data-action="variant" data-id="'+k+'" class="'+(k===variant?'active':'')+'" aria-label="方案 '+k+' '+labels[k]+'" aria-pressed="'+(k===variant)+'">'+k+'</button>').join('');document.documentElement.dataset.variant=variant;}
function setVariant(k){variant=k;view='overview';runFilter='all';const u=new URL(location.href);u.searchParams.set('variant',k);history.replaceState(null,'',u);render();}
function cycle(n){const keys=Object.keys(labels);setVariant(keys[(keys.indexOf(variant)+n+3)%3]);}
function toast(text){clearTimeout(toastTimer);$('#toast').textContent=text;$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,3500);}
function openOverlay(id){lastFocus=document.activeElement;$('#'+id).hidden=false;$('#'+id+' [role=dialog]').focus();document.body.style.overflow='hidden';}
function closeOverlay(id){$('#'+id).hidden=true;if($('#detail-overlay').hidden&&$('#modal-overlay').hidden){document.body.style.overflow='';if(lastFocus&&lastFocus.isConnected)lastFocus.focus();}}
function showTask(id){const t=data.tasks.find(t=>t.id===id);if(!t)return;let actions='';if(t.stage==='person/confirm')actions=btn('确认原动作','confirm-task',t.id,'primary')+btn('拒绝','reject-task',t.id,'danger');else if(t.stage==='person/answer')actions='<label class="detail-label" for="task-answer">回复负责人</label><textarea id="task-answer" placeholder="例如：仅检查开发 profile"></textarea><div class="detail-actions">'+btn('提交答复','answer-task',t.id,'primary')+'</div>';else actions=btn('打开负责人会话','session',t.owner,'primary');$('#detail-content').innerHTML='<div class="kicker">任务 · '+esc(owner(t.owner).repo)+'</div><h2 id="detail-title" style="font-size:21px">'+esc(t.title)+'</h2><div class="row" style="margin-top:14px">'+stagePill(t)+pill(t.source)+'</div><p class="small muted" style="margin-top:16px">'+esc(t.detail)+'</p><div class="detail-label">'+(t.result?'结果与验证':'已记录的事实')+'</div><div class="detail-box">'+esc(t.facts)+'</div><div class="detail-label">目标会话</div><div class="detail-box">'+esc(t.target)+'</div><div class="detail-label">来源</div><div class="small muted">'+t.source+' · '+t.time+' · '+esc(t.id)+'</div><div class="detail-actions">'+actions+'</div>'+(t.stage==='person/review'?'<p class="small muted" style="margin-top:12px">验收和追问在负责人会话中处理。</p>':'');openOverlay('detail-overlay');}
function showRun(id){const r=data.runs.find(r=>r.id===id);if(!r)return;$('#detail-content').innerHTML='<div class="kicker">运行记录 · '+esc(owner(r.owner).repo)+'</div><h2 id="detail-title" style="font-size:21px">'+esc(r.title)+'</h2><div style="margin-top:14px">'+pill(runText[r.status],runTone[r.status])+'</div><div class="detail-label">本次通知决定</div><div class="detail-box">'+esc(r.summary)+'</div><div class="detail-label">运行事实</div><div class="detail-box">来源：'+r.source+'\n时间：'+r.time+'\n负责人身份：'+esc(r.owner)+'\n运行标识：'+r.id+'</div>'+(r.status==='waiting'?'<div class="detail-label">汇总规则</div><div class="detail-box">同一接收位置共享普通结果额度。\n同一任务展示最新结果，不同任务逐项保留。\n新结果不延长既定等待截止点。</div>':'')+(r.status==='failed'?'<div class="detail-label">投递记录</div><div class="detail-box">示例错误：飞书连接不可用\n发送意图已保留，不等同于决定不通知。\n重试过程可查询，不把失败显示成成功。</div>':'')+(r.task?'<div class="detail-actions">'+btn('关联任务','task',r.task,'primary')+'</div>':'');openOverlay('detail-overlay');}
function showOwner(id){const o=owner(id);$('#detail-content').innerHTML='<div class="kicker">负责人身份</div><h2 id="detail-title" style="font-size:21px">'+esc(o.name)+'</h2><div class="detail-label">责任范围</div><div class="detail-box">'+esc(o.repo)+'</div><div class="detail-label">当前实例</div><div class="detail-box">'+esc(o.session)+'\n'+(o.busy?'正在处理消息':'当前空闲')+'</div><div class="detail-label">未完成任务</div>'+taskRows(data.tasks.filter(t=>t.owner===id&&t.stage!=='done'))+'<div class="detail-actions">'+btn('打开会话','session',id,'primary')+btn('更换新实例','rotate',id)+'</div>'+(o.archived?'<div class="detail-label">归档记录</div><div class="detail-box">'+esc(o.archived)+'</div>':'');openOverlay('detail-overlay');}
function showSession(id){const o=owner(id);$('#detail-content').innerHTML='<div class="kicker">负责人会话入口</div><h2 id="detail-title">'+esc(o.name)+'</h2><div class="detail-box" style="margin-top:20px">当前实例：'+esc(o.session)+'\n责任范围：'+esc(o.repo)+'</div><p class="small muted" style="margin-top:16px">原型展示此处的会话入口；实际页面将打开对应的 DSH 会话。</p>'+(o.handoff?'<div class="detail-label">已确认交接背景 · 来源 '+esc(o.handoff.source)+'</div><div class="detail-box">'+esc(o.handoff.text)+'</div>':'');openOverlay('detail-overlay');}
function rotationStart(id){if(rotation){toast('先完成或关闭当前更换演示');return;}rotation={owner:id,phase:'choose',summary:false,text:'',failed:false};renderRotation();openOverlay('modal-overlay');}
function renderRotation(){const r=rotation,o=owner(r.owner),phases=['wait','prepare','commit','archive','done'],idx=r.phase==='archive-failed'?3:phases.indexOf(r.phase);let content='<div class="kicker">'+esc(o.name)+'</div><h2 id="modal-title">更换为全新会话</h2><p class="small muted" style="margin-top:8px">负责人身份保持不变，执行会话与定时器继续运行。</p>';
if(r.phase==='choose'){content+='<label class="choice"><input type="radio" name="handoff" value="facts" checked><span><strong>仅加载基础事实清单</strong><br><span class="muted">身份、未完成任务、待处理事项与最近汇报入口。</span></span></label><label class="choice"><input type="radio" name="handoff" value="summary"><span><strong>另附交接摘要</strong><br><span class="muted">先预览和修改旧聊天背景，确认后带入。</span></span></label><div class="detail-actions">'+btn('继续','rotation-continue',null,'primary')+btn('暂不更换','rotation-cancel')+'</div>';}
else if(r.phase==='preview'){content+='<div class="detail-label">交接摘要草稿 · 来源 '+esc(o.session)+'</div><textarea id="handoff-summary" style="width:100%;min-height:150px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;font:inherit">当前在讨论工作台的信息层级，偏向把需要用户处理的事项放在首屏。任务状态和授权以任务记录为准。</textarea><p class="tiny" style="margin-top:8px">仅作讨论背景，不据此恢复授权或验收事实。</p><div class="detail-actions">'+btn('确认摘要并继续','rotation-confirm-summary',null,'primary')+btn('取消更换','rotation-cancel')+'</div>';}
else{content+='<div class="steps">'+['等待空闲','准备新实例','切换绑定','归档旧实例'].map((s,i)=>'<div class="step '+(idx===i?'active':idx>i?'complete':'')+'">'+s+'</div>').join('')+'</div>';
if(r.phase==='wait')content+='<div class="notice warn">旧实例正在处理消息。新普通请求先排队，必要回复、确认和喊停仍可处理。</div><div class="detail-actions">'+btn('模拟当前处理结束','rotation-idle',null,'primary')+btn('取消等待','rotation-cancel')+'</div>';
if(r.phase==='prepare')content+='<div class="notice">新实例正在加载事实清单'+(r.summary?'及已确认的交接摘要':'')+'。初始化完成前不接普通任务，不执行对外动作。</div><div class="detail-box" style="margin-top:14px">当前负责人绑定仍是 '+esc(o.session)+'\nL3 执行会话：保持运行\n外部记忆：未启用</div><div class="detail-actions">'+btn('模拟初始化成功','rotation-ready',null,'primary')+btn('模拟准备失败','rotation-fail',null,'danger')+btn('取消更换','rotation-cancel')+'</div>';
if(r.phase==='commit')content+='<div class="notice">新实例初始化已完成，可以提交负责人绑定。排队消息将在切换后交给新实例。</div><div class="detail-actions">'+btn('提交负责人绑定','rotation-commit',null,'primary')+btn('取消更换','rotation-cancel')+'</div>';
if(r.phase==='archive'||r.phase==='archive-failed')content+='<div class="notice '+(r.phase==='archive-failed'?'warn':'')+'">'+(r.phase==='archive-failed'?'旧实例归档失败，新实例继续服务。重试归档，不回退负责人绑定。':'负责人绑定已切换，新实例已接管。接下来归档旧实例。')+'</div><div class="detail-box" style="margin-top:14px">当前实例：'+esc(o.session)+'\n待归档：'+esc(o.archivePending)+'</div><div class="detail-actions">'+btn(r.phase==='archive-failed'?'重试归档成功':'模拟归档成功','rotation-archive',null,'primary')+(r.phase==='archive'?btn('模拟归档失败','rotation-archive-fail',null,'danger'):btn('稍后重试','rotation-finish'))+'</div>';
if(r.phase==='done')content+='<div class="notice">已完成切换。新消息跟随负责人身份，具体执行会话动作保持原目标。</div><div class="detail-box" style="margin-top:14px">当前实例：'+esc(o.session)+'\n已归档旧实例：'+esc(o.archived)+'\nL3 与 timer 会话：继续运行\n'+(r.summary?'交接摘要：已由用户确认':'交接摘要：未携带')+'</div><div class="detail-actions">'+btn('查看新实例','rotation-open',null,'primary')+btn('查看旧记录','rotation-old')+btn('完成','rotation-finish')+'</div>';
if(r.phase==='failed')content+='<div class="notice warn">新实例准备失败。尚未切换绑定，旧实例继续服务，排队消息恢复投递。</div><div class="detail-box" style="margin-top:14px">当前实例仍是 '+esc(o.session)+'\n示例原因：初始化上下文投递未成功\n旧实例未归档</div><div class="detail-actions">'+btn('重新准备','rotation-retry',null,'primary')+btn('结束演示','rotation-finish')+'</div>';}
$('#modal-content').innerHTML=content;$('#modal-kicker').textContent='手动更换 · 交互演示';}
function confirmTask(t,approved){$('#modal-kicker').textContent='确认具体动作';$('#modal-content').innerHTML='<h2 id="modal-title">'+(approved?'确认执行原动作？':'拒绝这项动作？')+'</h2><p class="small muted" style="margin-top:12px">'+esc(t.title)+'</p><div class="detail-box" style="margin-top:16px">'+esc(t.facts)+'</div><p class="small muted" style="margin-top:12px">目标与动作保持原请求，执行前需重新核对。此处仅模拟状态变化。</p><div class="detail-actions">'+btn(approved?'确认执行':'确认拒绝','apply-confirm',t.id+(approved?':yes':':no'),approved?'primary':'danger')+btn('返回','close-modal')+'</div>';openOverlay('modal-overlay');}
function timerCancel(id){pendingTimer=id;const t=data.timers.find(t=>t.id===id);$('#modal-kicker').textContent='定时器管理';$('#modal-content').innerHTML='<h2 id="modal-title">取消这枚定时器？</h2><p class="small muted" style="margin-top:12px">'+esc(t.title)+'</p><div class="notice warn" style="margin-top:18px">停止后续唤醒，已有运行与通知记录保留。</div><div class="detail-actions">'+btn('确认取消','timer-cancel-confirm',id,'danger')+btn('保留','close-modal')+'</div>';openOverlay('modal-overlay');}
function action(a,id){if(a==='nav'){view=id;runFilter='all';render();return;}if(a==='variant'){setVariant(id);return;}if(a==='workspace'){scope=id;render();return;}if(a==='task'){showTask(id);return;}if(a==='owner'){showOwner(id);return;}if(a==='run'){showRun(id);return;}if(a==='session'){showSession(id);return;}if(a==='run-filter'){runFilter=id;render();return;}if(a==='metric'){const ts=tasks().filter(t=>id==='needs'?needs(t):id==='results'?!!t.result:t.stage===id);$('#detail-content').innerHTML='<h2 id="detail-title">'+({needs:'需要你处理',working:'进行中',queued:'排队中',results:'可查看的结果'}[id])+'</h2><div style="margin-top:18px">'+taskRows(ts)+'</div>';openOverlay('detail-overlay');return;}
if(a==='confirm-task'||a==='reject-task'){confirmTask(data.tasks.find(t=>t.id===id),a==='confirm-task');return;}if(a==='apply-confirm'){const parts=id.split(':'),t=data.tasks.find(t=>t.id===parts[0]);t.stage=parts[1]==='yes'?'working':'blocked';t.detail=parts[1]==='yes'?'已确认原动作，继续执行。':'用户拒绝动作，任务暂停等待后续处理。';closeOverlay('modal-overlay');closeOverlay('detail-overlay');render();toast('示例状态已更新，未执行真实动作');return;}
if(a==='answer-task'){const value=$('#task-answer').value.trim();if(!value){toast('先填写答复');return;}const t=data.tasks.find(t=>t.id===id);t.stage='working';t.detail='已收到答复：'+value;closeOverlay('detail-overlay');render();toast('答复已提交给示例任务');return;}
if(a==='timer-toggle'){const t=data.timers.find(t=>t.id===id);t.state=t.state==='active'?'paused':'active';t.next=t.state==='paused'?'已暂停':t.kind==='schedule'?'明天 09:00':'今天 20:30';render();toast(t.state==='active'?'已恢复示例定时器':'已暂停示例定时器');return;}if(a==='timer-cancel'){timerCancel(id);return;}if(a==='timer-cancel-confirm'){const t=data.timers.find(t=>t.id===id);t.state='cancelled';t.next='不再唤醒';pendingTimer=null;closeOverlay('modal-overlay');render();toast('示例定时器已取消，历史记录保留');return;}
if(a==='rotate'){rotationStart(id);return;}if(a==='rotation-continue'){rotation.summary=$('input[name=handoff]:checked').value==='summary';rotation.phase=rotation.summary?'preview':owner(rotation.owner).busy?'wait':'prepare';renderRotation();return;}if(a==='rotation-confirm-summary'){const text=$('#handoff-summary').value.trim();if(!text){toast('先填写交接背景，或返回选择仅带事实清单');return;}rotation.text=text;rotation.phase=owner(rotation.owner).busy?'wait':'prepare';renderRotation();return;}if(a==='rotation-idle'){owner(rotation.owner).busy=false;rotation.phase='prepare';renderRotation();return;}if(a==='rotation-ready'){rotation.phase='commit';renderRotation();return;}if(a==='rotation-fail'){rotation.phase='failed';renderRotation();return;}if(a==='rotation-retry'){rotation.phase='prepare';renderRotation();return;}if(a==='rotation-commit'){const o=owner(rotation.owner);o.archivePending=o.session;o.generation=(o.generation||1)+1;o.session=o.id+'-owner-'+String(o.generation).padStart(2,'0');o.handoff=rotation.summary?{text:rotation.text,source:o.archivePending}:null;o.busy=false;rotation.phase='archive';render();renderRotation();return;}if(a==='rotation-archive'){const o=owner(rotation.owner);o.archived=o.archivePending;o.archivePending=null;rotation.phase='done';render();renderRotation();return;}if(a==='rotation-archive-fail'){rotation.phase='archive-failed';renderRotation();return;}if(a==='rotation-open'){const id=rotation.owner;rotation=null;closeOverlay('modal-overlay');showSession(id);return;}if(a==='rotation-old'){const o=owner(rotation.owner);toast('已归档旧记录：'+o.archived+'（示例入口）');return;}if(a==='rotation-cancel'||a==='rotation-finish'){rotation=null;closeOverlay('modal-overlay');render();return;}if(a==='close-modal'){closeOverlay('modal-overlay');return;}
if(a==='memory'){$('#detail-content').innerHTML='<div class="kicker">外部记忆 · 接入暂缓</div><h2 id="detail-title">先确定收益，再决定接入</h2><div class="detail-label">目标</div><div class="detail-box">个人工作偏好、项目长期背景、跨会话讨论。\n系统归纳先成为候选，经用户确认后采用。\n项目记忆默认只用于对应项目。</div><div class="detail-label">评测</div><div class="detail-box">新会话回放真实案例，与关闭记忆的基线比较。\n先检查范围、撤回、权威性与失效条件，再比较收益、耗时和 token。\n没有明确收益，继续保持关闭。</div><p class="small muted" style="margin-top:15px">当前尚未选择记忆系统，因此没有可启用的服务或开关。</p>';openOverlay('detail-overlay');return;}}
document.addEventListener('click',e=>{const close=e.target.closest('[data-close]');if(close){const id=close.dataset.close;if(id==='modal-overlay'&&rotation&&['wait','prepare','commit','archive'].includes(rotation.phase)){toast('请使用当前步骤中的操作按钮');return;}if(id==='modal-overlay')rotation=null;closeOverlay(id);return;}const b=e.target.closest('[data-action]');if(b)action(b.dataset.action,b.dataset.id);});
document.addEventListener('change',e=>{if(e.target.id==='scope'){scope=e.target.value;render();}if(e.target.id==='notify-interval')toast('示例通知间隔：'+e.target.value+' 秒（不写入配置）');});
$('#search').addEventListener('input',e=>{query=e.target.value;view='overview';render();});
$('#previous').addEventListener('click',()=>cycle(-1));$('#next').addEventListener('click',()=>cycle(1));
$('#theme').addEventListener('click',()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';});
$('#reset').addEventListener('click',()=>{data=structuredClone(initial);scope='all';query='';view='overview';runFilter='all';rotation=null;$('#search').value='';closeOverlay('modal-overlay');closeOverlay('detail-overlay');render();toast('已恢复初始示例场景');});
document.addEventListener('keydown',e=>{const typing=e.target.closest('input,textarea,select,[contenteditable=true]');if(e.key==='Escape'){if($('#modal-overlay').hidden&&$('#detail-overlay').hidden)return;if(!$('#modal-overlay').hidden){if(rotation&&['wait','prepare','commit','archive'].includes(rotation.phase))return;rotation=null;closeOverlay('modal-overlay');}else closeOverlay('detail-overlay');return;}if(e.key==='Tab'&&(!$('#modal-overlay').hidden||!$('#detail-overlay').hidden)){const box=!$('#modal-overlay').hidden?$('#modal-overlay'):$('#detail-overlay'),els=Array.from(box.querySelectorAll('button:not(:disabled),input,textarea,select,[tabindex="0"]')).filter(x=>!x.hidden);if(els.length){const first=els[0],last=els[els.length-1];if(e.shiftKey&&(document.activeElement===first||document.activeElement===box.querySelector('[role=dialog]'))){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}return;}if(typing||!$('#modal-overlay').hidden||!$('#detail-overlay').hidden)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1);}if(e.key==='/'){e.preventDefault();$('#search').focus();}});
document.documentElement.dataset.theme=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';render();
})();
</script>
</body>
</html>
